name: 校验 Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: 仓库结构校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: 校验 Skill 结构与脚本
        run: python3 scripts/validate_repo.py
