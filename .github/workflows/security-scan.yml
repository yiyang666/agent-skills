name: SkillSpector 安全扫描

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillspector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: SkillSpector 静态安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: 安装 uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: 扫描全部 Skills
        shell: bash
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
        run: |
          set -euo pipefail
          mkdir -p reports
          found=0
          failed=0
          for skill_dir in skills/*; do
            if [[ ! -d "$skill_dir" ]]; then
              continue
            fi
            found=1
            skill_name="$(basename "$skill_dir")"
            echo "::group::扫描 ${skill_name}"
            if ! python3 scripts/scan_skill.py \
              "$skill_dir" \
              --output-dir "reports/${skill_name}"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          if [[ "$found" -eq 0 ]]; then
            echo "skills/ 下没有可扫描的 Skill" >&2
            exit 1
          fi
          exit "$failed"

      - name: 保存扫描报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillspector-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
